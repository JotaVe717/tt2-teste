<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub TT2 - Clã</title>
  
  <!-- Tailwind CSS para o design -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Biblioteca de ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Fonte moderna Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 flex min-h-screen">

  <!-- Menu Lateral -->
  <aside class="w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-4">
    <div class="flex items-center gap-3 mb-6">
      <!-- Ícone do Lucide: shield -->
      <i data-lucide="shield" class="w-8 h-8 text-amber-500"></i>
      <h2 class="text-xl font-extrabold text-white">Hub do Clã</h2>
    </div>
    
    <!-- Botão de Navegação 1 -->
    <a href="aflicoes.html" class="flex items-center gap-3 w-full bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white py-3 px-4 rounded-xl transition-colors font-semibold border border-transparent hover:border-slate-600">
      <!-- Ícone do Lucide: flask-conical -->
      <i data-lucide="flask-conical" class="w-5 h-5 text-emerald-400"></i>
      Tabela de Aflições
    </a>
    
    <!-- Botão de Navegação 2 -->
    <a href="guia.html" class="flex items-center gap-3 w-full bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white py-3 px-4 rounded-xl transition-colors font-semibold border border-transparent hover:border-slate-600">
      <!-- Ícone do Lucide: crosshairs -->
      <i data-lucide="crosshairs" class="w-5 h-5 text-rose-400"></i>
      Guia de Foguetes
    </a>
  </aside>

  <!-- Ecrã Principal -->
  <main class="flex-1 p-10">
    <div class="w-full max-w-4xl mx-auto text-center py-20">
      <!-- Ícone decorativo no centro -->
      <div class="flex justify-center mb-4">
        <i data-lucide="swords" class="w-16 h-16 text-slate-700"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-400">Bem-vindo ao Hub</h1>
      <p class="text-slate-500 mt-2">Selecione uma ferramenta no menu lateral.</p>
    </div>
  </main>

  <!-- Script que desenha os ícones na ecrã (Sempre no fim antes de fechar o body) -->
  <script>
    lucide.createIcons();
  </script>
  
</body>
</html>
