<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub TT2</title>
  
  <!-- Tailwind para ficar bonito -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- O "Motor" do HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex">

  <!-- Menu Lateral -->
  <aside class="w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-4">
    <h2 class="text-xl font-extrabold text-emerald-400 mb-4">Menu do Clã</h2>
    
    <!-- O BOTÃO MÁGICO DO HTMX -->
    <button 
      hx-get="tabela-aflicoes.html" 
      hx-target="#conteudo-principal" 
      hx-swap="innerHTML"
      class="text-left w-full bg-slate-800 hover:bg-slate-700 text-white py-3 px-4 rounded-xl transition-colors font-semibold border border-slate-700">
      Ver Tabela de Aflições
    </button>
    
    <button 
      hx-get="guia-foguetes.html" 
      hx-target="#conteudo-principal" 
      hx-swap="innerHTML"
      class="text-left w-full bg-slate-800 hover:bg-slate-700 text-white py-3 px-4 rounded-xl transition-colors font-semibold border border-slate-700">
      Estratégia de Cartas
    </button>
  </aside>

  <!-- O Ecrã Principal (Onde a magia acontece) -->
  <main class="flex-1 p-10">
    <div id="conteudo-principal" class="w-full max-w-4xl mx-auto">
      <!-- O conteúdo inicial -->
      <div class="text-center py-20">
        <h1 class="text-3xl font-bold text-slate-400">Bem-vindo ao Hub</h1>
        <p class="text-slate-500 mt-2">Clique num botão do menu para carregar o conteúdo aqui, sem recarregar o site.</p>
      </div>
    </div>
  </main>

</body>
</html>
