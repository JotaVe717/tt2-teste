  calcLevel(skill) {
    if (!skill) return 0;
    let baseW = skill.w[this.build] !== undefined ? skill.w[this.build] : 0;
    if (skill.gMod) {
      let gm = skill.gMod[this.gold] !== undefined ? skill.gMod[this.gold] : 1;
      baseW = baseW * gm;
    }
    if (baseW <= 0.05) return 0;
    
    let factor = Math.min(1, Math.max(0.05, this.totalSP / 6500));
    let rawLevel = Math.round(skill.max * baseW * factor);
    return Math.min(skill.max, Math.max(1, rawLevel));
  },

  treeTotalLevels(tree) {
    let sum = this.calcLevel(tree.root);
    tree.rows.forEach(r => r.forEach(s => { if (s) sum += this.calcLevel(s); }));
    return sum;
  }
}">

  <!-- Cabeçalho -->
  <div class="text-center space-y-2 mb-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight uppercase">
      Otimizador Visual de <span class="text-amber-500">Skill Tree</span>
    </h1>
    <p class="text-slate-400 text-sm">Disposição idêntica ao jogo — clique em qualquer quadrado para ver o nome e limite da habilidade</p>
  </div>

  <!-- Painel de Controlo -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- 1. Build -->
      <div>
        <label class="block text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3">1. Build Principal</label>
        <div class="grid grid-cols-2 gap-2">
          <template x-for="b in builds">
            <button 
              @click="build = b.id"
              :class="build === b.id ? 'bg-emerald-500 text-slate-950 font-extrabold border-emerald-400 shadow-[0_0_12px_rgba(16,185,129,0.3)]' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'"
              class="py-2 px-3 rounded-xl border text-xs transition-all text-center"
              x-text="b.name">
            </button>
          </template>
        </div>
      </div>

      <!-- 2. Ouro -->
      <div>
        <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-3">2. Fonte de Ouro</label>
        <div class="flex flex-col gap-2">
          <template x-for="g in golds">
            <button 
              @click="gold = g.id"
              :class="gold === g.id ? 'bg-amber-500 text-slate-950 font-extrabold border-amber-400 shadow-[0_0_12px_rgba(245,158,11,0.3)]' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'"
              class="py-2 px-4 rounded-xl border text-xs transition-all text-left flex justify-between items-center">
              <span x-text="g.name"></span>
              <span x-show="gold === g.id" class="text-slate-950 font-black">✓</span>
            </button>
          </template>
        </div>
      </div>

      <!-- 3. SP -->
      <div class="flex flex-col justify-between bg-slate-950/60 p-4 rounded-xl border border-slate-800">
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">3. Meus Pontos (SP)</label>
            <span class="text-xs text-slate-400" x-text="totalSP + ' SP'"></span>
          </div>
          <input 
            type="number" 
            x-model.number="totalSP" 
            min="50" max="20000" step="50"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-4 text-xl font-extrabold text-emerald-400 focus:outline-none focus:border-emerald-500"
          >
        </div>
        <div class="mt-4">
          <input 
            type="range" 
            x-model.number="totalSP" 
            min="100" max="10000" step="100"
            class="w-full accent-emerald-500 cursor-pointer"
          >
          <div class="flex justify-between text-[10px] text-slate-500 mt-1">
            <span>100 SP</span>
            <span>5000 SP</span>
            <span>10000+ SP</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Barra de Detalhes da Habilidade Selecionada (Estilo Rodapé do Jogo) -->
    <div x-show="selectedSkill" x-transition class="p-4 rounded-xl bg-slate-950 border border-slate-700 flex items-center justify-between">
      <div>
        <span class="text-xs uppercase font-bold text-amber-400 block">Habilidade Selecionada</span>
        <h4 class="text-lg font-extrabold text-white" x-text="selectedSkill ? selectedSkill.name : ''"></h4>
      </div>
      <div class="text-right">
        <span class="text-xs text-slate-400 block">Nível Recomendado / Limite</span>
        <span class="text-xl font-black text-emerald-400" x-text="selectedSkill ? ('Lv. ' + calcLevel(selectedSkill) + ' / ' + selectedSkill.max) : ''"></span>
      </div>
    </div>
  </div>

  <!-- Grelha Visual das 6 Árvores (Formato Idêntico ao Jogo) -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <template x-for="tree in trees">
      <div class="bg-gradient-to-b border rounded-2xl p-5 shadow-2xl flex flex-col justify-between" :class="[tree.border, tree.bg]">
        
        <!-- Topo da Árvore (Nome + Soma de Níveis) -->
        <div class="flex justify-between items-start mb-4 border-b border-slate-800/80 pb-3">
          <div>
            <h3 class="font-extrabold text-base tracking-wide text-white" x-text="tree.name"></h3>
            <span class="text-xs font-bold text-slate-400" x-text="'Lv. ' + treeTotalLevels(tree)"></span>
          </div>
          <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-slate-950/60 text-slate-400 border border-slate-800">
            3x5 Grid
          </span>
        </div>

        <!-- Estrutura da Árvore (1 Topo + 4 Linhas de 3 Colunas) -->
        <div class="flex flex-col items-center my-2 select-none">
          
          <!-- NÓ RAIZ (Tier 1 - Topo Central) -->
          <div class="relative flex flex-col items-center">
            <button 
              @click="selectedSkill = tree.root"
              :class="calcLevel(tree.root) > 0 ? tree.nodeActive : 'border-slate-800 bg-slate-950/50 text-slate-600 opacity-50'"
              class="w-16 h-16 rounded-xl border-2 flex flex-col items-center justify-center relative transition-transform hover:scale-105 cursor-pointer group">
              <span class="text-xl font-black leading-none" x-text="calcLevel(tree.root)"></span>
              <span class="text-[9px] text-slate-300 font-semibold truncate w-14 text-center mt-1 opacity-80 group-hover:opacity-100" x-text="tree.root.name.split(' ')[0]"></span>
              <span class="absolute top-0.5 right-1 text-[8px] opacity-60 font-mono" x-text="'/' + tree.root.max"></span>
            </button>
            
            <!-- Linhas de Conexão do Topo para as 3 Colunas -->
            <div class="w-0.5 h-3" :class="tree.lineColor"></div>
            <div class="w-36 sm:w-40 h-0.5" :class="tree.lineColor"></div>
          </div>

          <!-- LINHAS (Tiers 2 a 5) -->
          <div class="flex flex-col gap-3 w-full max-w-[220px]">
            <template x-for="(row, rIdx) in tree.rows">
              <div class="grid grid-cols-3 gap-3 place-items-center relative">
                <template x-for="(skill, cIdx) in row">
                  <div class="flex flex-col items-center relative">
                    
                    <!-- Conector Vertical Superior -->
                    <template x-if="skill">
                      <div class="w-0.5 h-3 -mt-3" :class="tree.lineColor"></div>
                    </template>

                    <!-- Quadrado da Habilidade -->
                    <template x-if="skill">
                      <button 
                        @click="selectedSkill = skill"
                        :title="skill.name + ' (Max: ' + skill.max + ')'"
                        :class="calcLevel(skill) > 0 ? tree.nodeActive : 'border-slate-800 bg-slate-950/50 text-slate-600 opacity-45'"
                        class="w-16 h-16 rounded-xl border-2 flex flex-col items-center justify-center relative transition-transform hover:scale-105 cursor-pointer group">
                        
                        <!-- Nível Grande no Centro -->
                        <span class="text-xl font-black leading-none" x-text="calcLevel(skill)"></span>
                        
                        <!-- Primeiro nome pequenininho embaixo para identificação rápida -->
                        <span class="text-[9px] font-semibold truncate w-14 text-center mt-1 opacity-75 group-hover:opacity-100" x-text="skill.name.split(' ')[0]"></span>
                        
                        <!-- Limite máximo discreto no canto -->
                        <span class="absolute top-0.5 right-1 text-[8px] opacity-50 font-mono" x-text="'/' + skill.max"></span>
                      </button>
                    </template>

                    <!-- Espaço Vazio (Quando o ramo termina antes do Tier 5, como no jogo) -->
                    <template x-if="!skill">
                      <div class="w-16 h-16"></div>
                    </template>

                  </div>
                </template>
              </div>
            </template>
          </div>

        </div>

      </div>
    </template>
  </div>

</div>
