  calcLevel(skill) {
    let baseW = skill.weight[this.build] !== undefined ? skill.weight[this.build] : 0;
    if (skill.goldMod) {
      let gMod = skill.goldMod[this.gold] !== undefined ? skill.goldMod[this.gold] : 1;
      baseW = baseW * gMod;
    }
    if (baseW <= 0) return 0;
    
    // Curva de progressão baseada em 4500 SP para atingir níveis máximos nas skills principais
    let factor = Math.min(1, Math.max(0.08, this.totalSP / 4500));
    let rawLevel = Math.round(skill.max * baseW * factor);
    return Math.min(skill.max, Math.max(1, rawLevel));
  },

  treeActiveCount(tree) {
    return tree.skills.filter(s => this.calcLevel(s) > 0).length;
  },

  shouldShow(skill) {
    if (this.hideZero && this.calcLevel(skill) === 0) return false;
    if (this.searchSkill !== '' && !skill.name.toLowerCase().includes(this.searchSkill.toLowerCase())) return false;
    return true;
  }
}">

  <!-- Cabeçalho -->
  <div class="text-center space-y-2 mb-6">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight uppercase">
      Otimizador Completo de <span class="text-emerald-400">Skill Tree</span>
    </h1>
    <p class="text-slate-400 text-sm">Todas as 6 Árvores (Knight, Summoner, Warlord, Sorcerer, Rogue e Alchemist) ajustadas em tempo real</p>
  </div>

  <!-- Painel de Controlo Principal -->
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- 1. Escolha da Build -->
      <div>
        <label class="block text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3">1. Escolha a Build de Dano</label>
        <div class="grid grid-cols-2 gap-2">
          <template x-for="b in builds">
            <button 
              @click="build = b.id"
              :class="build === b.id ? 'bg-emerald-500 text-slate-950 font-extrabold border-emerald-400 shadow-[0_0_12px_rgba(16,185,129,0.3)]' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
              class="py-2.5 px-3 rounded-xl border text-xs transition-all text-center"
              x-text="b.name">
            </button>
          </template>
        </div>
      </div>

      <!-- 2. Fonte de Ouro -->
      <div>
        <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-3">2. Escolha a Fonte de Ouro</label>
        <div class="flex flex-col gap-2">
          <template x-for="g in golds">
            <button 
              @click="gold = g.id"
              :class="gold === g.id ? 'bg-amber-500 text-slate-950 font-extrabold border-amber-400 shadow-[0_0_12px_rgba(245,158,11,0.3)]' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white'"
              class="py-2.5 px-4 rounded-xl border text-xs transition-all text-left flex justify-between items-center">
              <span x-text="g.name"></span>
              <span x-show="gold === g.id" class="text-slate-950 font-black">✓</span>
            </button>
          </template>
        </div>
      </div>

      <!-- 3. Quantidade de SP -->
      <div class="flex flex-col justify-between bg-slate-950/60 p-4 rounded-xl border border-slate-800">
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">3. Total de Pontos (SP)</label>
            <span class="text-xs text-slate-400" x-text="totalSP >= 4500 ? 'Modo Endgame' : (totalSP < 800 ? 'Modo Iniciante' : 'Modo Midgame')"></span>
          </div>
          <input 
            type="number" 
            x-model.number="totalSP" 
            min="50" max="15000" step="50"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-4 text-xl font-extrabold text-emerald-400 focus:outline-none focus:border-emerald-500"
          >
        </div>
        <div class="mt-4">
          <input 
            type="range" 
            x-model.number="totalSP" 
            min="100" max="6000" step="50"
            class="w-full accent-emerald-500 cursor-pointer"
          >
          <div class="flex justify-between text-[10px] text-slate-500 mt-1">
            <span>100 SP</span>
            <span>3000 SP</span>
            <span>6000+ SP</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Barra de Filtro Rápido e Ocultar Inúteis -->
    <div class="pt-4 border-t border-slate-800/80 flex flex-col sm:flex-row gap-4 justify-between items-center">
      <div class="relative w-full sm:w-80">
        <input 
          type="text" 
          x-model="searchSkill" 
          placeholder="Buscar habilidade (ex: Anchoring Shot)..." 
          class="w-full bg-slate-950 border border-slate-700 rounded-xl py-2 px-4 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 placeholder:text-slate-600"
        >
      </div>
      
      <label class="flex items-center gap-3 cursor-pointer select-none text-xs font-semibold text-slate-300 bg-slate-800/60 px-4 py-2 rounded-xl border border-slate-700 hover:border-slate-600 transition-colors">
        <input type="checkbox" x-model="hideZero" class="accent-emerald-500 w-4 h-4 rounded cursor-pointer">
        <span>Esconder habilidades inúteis (Nível 0)</span>
      </label>
    </div>
  </div>

  <!-- Grelha das 6 Árvores de Habilidade -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <template x-for="tree in trees">
      <div class="bg-slate-900 border rounded-2xl overflow-hidden shadow-xl flex flex-col" :class="tree.border">
        
        <!-- Cabeçalho da Árvore -->
        <div class="p-4 bg-slate-800/50 border-b border-slate-800 flex items-center justify-between">
          <h3 class="font-extrabold text-sm uppercase tracking-wider text-white" x-text="tree.name"></h3>
          <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full" :class="tree.badge" x-text="treeActiveCount(tree) + ' ativas'"></span>
        </div>

        <!-- Lista de Habilidades da Árvore -->
        <div class="p-4 space-y-2.5 flex-1">
          <template x-for="skill in tree.skills">
            <div x-show="shouldShow(skill)"
                 class="p-3 rounded-xl bg-slate-950/60 border border-slate-800/80 flex flex-col gap-2 transition-all"
                 :class="calcLevel(skill) === 0 ? 'opacity-35 hover:opacity-75' : 'hover:border-slate-700'">
              
              <div class="flex justify-between items-center gap-2">
                <div class="flex items-center gap-2">
                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-400" x-text="'T' + skill.tier"></span>
                  <span class="font-semibold text-xs text-slate-200" x-text="skill.name"></span>
                </div>
                
                <span class="text-xs font-black px-2 py-0.5 rounded shrink-0"
                      :class="calcLevel(skill) === skill.max ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : (calcLevel(skill) > 0 ? 'bg-slate-800 text-white border border-slate-700' : 'bg-slate-900 text-slate-600')"
                      x-text="calcLevel(skill) + ' / ' + skill.max">
                </span>
              </div>

              <!-- Barra de Nível estilo Nível de Água -->
              <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-800/80">
                <div class="h-full bg-gradient-to-r transition-all duration-500"
                     :class="tree.bar"
                     :style="`width: ${(calcLevel(skill) / skill.max) * 100}%`">
                </div>
              </div>

            </div>
          </template>
        </div>

      </div>
    </template>
  </div>

</div>
