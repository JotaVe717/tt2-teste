  getTree(className) {
    let root = this.skillsData.find(s => s.class === className && s.tierNum === 1);
    let allInClass = this.skillsData.filter(s => s.class === className && s.tierNum > 1);
    
    // Organizar em linhas Tiers 2, 3, 4, 5 em blocos de 3 colunas
    let rows = [
      allInClass.filter(s => s.tierNum === 2),
      allInClass.filter(s => s.tierNum === 3),
      allInClass.filter(s => s.tierNum === 4),
      allInClass.filter(s => s.tierNum === 5)
    ];

    return { root, rows };
  },

  calcLevel(skill) {
    if (!skill) return 0;
    let baseW = skill.w[this.build] !== undefined ? skill.w[this.build] : 0;
    if (skill.gMod) {
      let gm = skill.gMod[this.gold] !== undefined ? skill.gMod[this.gold] : 1;
      baseW = baseW * gm;
    }
    if (baseW <= 0.05) return 0;
    
    let factor = Math.min(1, Math.max(0.05, this.totalSP / 6500));
    let rawLevel = Math.round(skill.maxLevel * baseW * factor);
    return Math.min(skill.maxLevel, Math.max(1, rawLevel));
  },

  treeTotalLevels(className) {
    let skills = this.skillsData.filter(s => s.class === className);
    let sum = 0;
    skills.forEach(s => sum += this.calcLevel(s));
    return sum;
  }
}">

  <div class="text-center space-y-2 mb-6">

      Otimizador Visual de <span class="text-amber-500">Skill Tree</span>
    </h1>
    <p class="text-slate-400 text-sm">Dados oficiais integrados — clique em qualquer quadrado para ver o nome e o limite da habilidade</p>
  </div>

  <!-- Painel de Controlo -->

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <label class="block text-xs font-bold text-emerald-400 uppercase tracking-wider mb-3">1. Build Principal</label>
        <div class="grid grid-cols-2 gap-2">
          <template x-for="b in builds">
            <button 
              @click="build = b.id"
              :class="build === b.id ? 'bg-emerald-500 text-slate-950 font-extrabold border-emerald-400 shadow-[0_0_12px_rgba(16,185,129,0.3)]' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'"
              class="py-2 px-3 rounded-xl border text-xs transition-all text-center"
              x-text="b.name">
            </button>
          </template>
        </div>
      </div>

      <!-- 2. Ouro -->

          <template x-for="g in golds">
            <button 
              @click="gold = g.id"

              class="py-2 px-4 rounded-xl border text-xs transition-all text-left flex justify-between items-center">
              <span x-text="g.name"></span>
              <span x-show="gold === g.id" class="text-slate-950 font-black">✓</span>
            </button>
          </template>
        </div>
      </div>

      <!-- 3. SP -->

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-xs font-bold text-cyan-400 uppercase tracking-wider">3. Meus Pontos (SP)</label>
            <span class="text-xs text-slate-400" x-text="totalSP + ' SP'"></span>
          </div>
          <input 
            type="number" 
            x-model.number="totalSP" 
            min="50" max="20000" step="50"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-2 px-4 text-xl font-extrabold text-emerald-400 focus:outline-none focus:border-emerald-500"
          >
        </div>
        <div class="mt-4">
          <input 
            type="range" 
            x-model.number="totalSP" 
            min="100" max="10000" step="100"
            class="w-full accent-emerald-500 cursor-pointer"
          >
          <div class="flex justify-between text-[10px] text-slate-500 mt-1">
            <span>100 SP</span>
            <span>5000 SP</span>
            <span>10000+ SP</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Barra de Detalhes da Habilidade Selecionada -->
    <div x-show="selectedSkill" x-transition class="p-4 rounded-xl bg-slate-950 border border-slate-700 flex items-center justify-between">
      <div>
        <span class="text-xs uppercase font-bold text-amber-400 block">Habilidade Selecionada</span>
        <h4 class="text-lg font-extrabold text-white" x-text="selectedSkill ? selectedSkill.name : ''"></h4>
      </div>
      <div class="text-right">
        <span class="text-xs text-slate-400 block">Nível Recomendado / Limite (Oficial)</span>
        <span class="text-xl font-black text-emerald-400" x-text="selectedSkill ? ('Lv. ' + calcLevel(selectedSkill) + ' / ' + selectedSkill.maxLevel) : ''"></span>
      </div>
    </div>
  </div>

  <!-- Grelha Visual das 6 Árvores Baseadas nos Dados Oficiais -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <template x-for="className in ['Knight', 'Pet', 'Warlord', 'Sorcerer', 'Rogue', 'Alchemist']">
      <div class="bg-gradient-to-b border rounded-2xl p-5 shadow-2xl flex flex-col justify-between" 
           :class="{
             'border-slate-500/40 from-slate-900 via-slate-900 to-slate-800/60': className === 'Knight',
             'border-orange-500/40 from-slate-900 via-slate-900 to-orange-950/30': className === 'Pet',
             'border-amber-500/40 from-slate-900 via-slate-900 to-amber-950/30': className === 'Warlord',
             'border-cyan-500/40 from-slate-900 via-slate-900 to-cyan-950/30': className === 'Sorcerer',
             'border-emerald-500/40 from-slate-900 via-slate-900 to-emerald-950/30': className === 'Rogue',
             'border-purple-500/40 from-slate-900 via-slate-900 to-purple-950/30': className === 'Alchemist'
           }">
        
        <!-- Topo da Árvore -->
        <div class="flex justify-between items-start mb-4 border-b border-slate-800/80 pb-3">
          <div>
            <h3 class="font-extrabold text-base tracking-wide text-white" x-text="className === 'Pet' ? 'Summoner' : className"></h3>
            <span class="text-xs font-bold text-slate-400" x-text="'Lv. ' + treeTotalLevels(className)"></span>
          </div>
          <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-slate-950/60 text-slate-400 border border-slate-800">
            Oficial
          </span>
        </div>

        <!-- Estrutura Visual da Árvore -->
        <div class="flex flex-col items-center my-2 select-none" x-data="{ tData: getTree(className) }">
          
          <!-- NÓ RAIZ (Tier 1) -->
          <div class="relative flex flex-col items-center" x-show="tData.root">
            <button 
              @click="selectedSkill = tData.root"
              :class="calcLevel(tData.root) > 0 ? 'border-slate-300 bg-slate-800 text-white shadow-[0_0_12px_rgba(203,213,225,0.25)]' : 'border-slate-800 bg-slate-950/50 text-slate-600 opacity-50'"
              class="w-16 h-16 rounded-xl border-2 flex flex-col items-center justify-center relative transition-transform hover:scale-105 cursor-pointer group">
              <span class="text-xl font-black leading-none" x-text="calcLevel(tData.root)"></span>
              <span class="text-[9px] text-slate-300 font-semibold truncate w-14 text-center mt-1 opacity-80 group-hover:opacity-100" x-text="tData.root.name.split(' ')[0]"></span>
              <span class="absolute top-0.5 right-1 text-[8px] opacity-60 font-mono" x-text="'/' + tData.root.maxLevel"></span>
            </button>
            <div class="w-0.5 h-3 bg-slate-600"></div>
            <div class="w-36 sm:w-40 h-0.5 bg-slate-600"></div>
          </div>

          <!-- LINHAS (Tiers 2 a 5) -->
          <div class="flex flex-col gap-3 w-full max-w-[220px]">
            <template x-for="row in tData.rows">
              <div class="grid grid-cols-3 gap-3 place-items-center relative">
                <template x-for="skill in row">
                  <div class="flex flex-col items-center relative">
                    
                    <template x-if="skill">
                      <div class="w-0.5 h-3 -mt-3 bg-slate-600"></div>
                    </template>

                    <template x-if="skill">
                      <button 
                        @click="selectedSkill = skill"
                        :title="skill.name + ' (Max: ' + skill.maxLevel + ')'"
                        :class="calcLevel(skill) > 0 ? 'border-slate-300 bg-slate-800 text-white shadow-[0_0_12px_rgba(203,213,225,0.25)]' : 'border-slate-800 bg-slate-950/50 text-slate-600 opacity-45'"
                        class="w-16 h-16 rounded-xl border-2 flex flex-col items-center justify-center relative transition-transform hover:scale-105 cursor-pointer group">
                        
                        <span class="text-xl font-black leading-none" x-text="calcLevel(skill)"></span>
                        <span class="text-[9px] font-semibold truncate w-14 text-center mt-1 opacity-75 group-hover:opacity-100" x-text="skill.name.split(' ')[0]"></span>
                        <span class="absolute top-0.5 right-1 text-[8px] opacity-50 font-mono" x-text="'/' + skill.maxLevel"></span>
                      </button>
                    </template>

                    <template x-if="!skill">
                      <div class="w-16 h-16"></div>
                    </template>

                  </div>
                </template>
              </div>
            </template>
          </div>

        </div>

      </div>
    </template>
  </div>

</div>
